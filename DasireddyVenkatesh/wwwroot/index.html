<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>DasireddyVenkatesh</title>

    <base href="/" />
    <link href="DasireddyVenkatesh.styles.css" rel="stylesheet" />
    <!-- Application CSS -->
    <link rel="stylesheet" href="css/app.css" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Favicon -->
    <link rel="icon"
          type="image/png"
          sizes="192x192"
          href="D_icon_192x192.png" />

    <link rel="icon"
          type="image/png"
          sizes="512x512"
          href="D_icon_512x512.png" />

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet" />

    <!-- MudBlazor CSS -->
    <link href="_content/MudBlazor/MudBlazor.min.css"
          rel="stylesheet" />

    <script>
        try {
            if (localStorage.getItem('portfolio-theme') === 'light') {
                document.documentElement.dataset.portfolioTheme = 'light';
            }
        } catch { }

        window.finishPortfolioStartup = () => {
            const startupScreen = document.getElementById('startup-screen');
            if (!startupScreen) return;

            startupScreen.classList.add('is-exiting');
            window.setTimeout(() => startupScreen.remove(), 220);
        };
    </script>

    <script type="importmap"></script>
</head>

<body>

    <!-- Blazor Application -->
    <div id="app"></div>

    <main id="startup-screen" class="modern-loader" aria-label="Portfolio loading">
            <div class="loader-atmosphere" aria-hidden="true"></div>
            <section class="loader-card" aria-live="polite">
                <div class="loader-brand-row">
                    <img src="D_icon_192x192.png"
                         class="loader-logo"
                         alt="" />
                    <div class="loader-brand-copy">
                        <span class="loader-eyebrow">PERSONAL PORTFOLIO</span>
                        <span class="loader-brand-name">DasireddyVenkatesh</span>
                    </div>
                    <span class="loader-live-dot" aria-label="Starting"></span>
                </div>

                <div class="loader-message">
                    <span class="loader-kicker">A moment, please</span>
                    <h1 class="loader-title">Building the experience.</h1>
                    <p class="loader-subtitle">Thoughtful software, made useful.</p>
                </div>

                <div class="loader-progress-group">
                    <div class="loader-progress" role="progressbar"
                         aria-label="Portfolio download progress"
                         aria-valuemin="0" aria-valuemax="100">
                        <span></span>
                    </div>
                    <div class="loader-progress-meta">
                        <span>Preparing your portfolio</span>
                        <span class="loader-percentage" aria-hidden="true"></span>
                    </div>
                </div>
            </section>
            <span class="loader-footer">DESIGNED TO MAKE COMPLEXITY FEEL SIMPLE</span>
    </main>

    <!-- MudBlazor JavaScript -->
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <!-- Blazor WebAssembly -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .catch(error => console.error('Service worker registration failed:', error));
        }
    </script>

</body>

</html>
